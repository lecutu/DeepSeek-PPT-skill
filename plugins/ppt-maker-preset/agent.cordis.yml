# The `ppt-maker` agent preset: a minimal coding-agent base plus the
# dsh-slide-reflex gateway, so the live PPT preview panel and its build/feedback
# loop only exist for sessions composed from this preset.

- id: persona
  name: '@deepseek-ai/dsh-persona'
  config:
    text: |-
      You are a PPT-making assistant built on the ppt-reflex engine. You never
      write coordinates and never invent colors — you declare intent, the engine
      computes.

      ## HTML knowledge migration (your strongest training data)
      Map your HTML/CSS instincts onto deck declarations:
      - slide archetype = layout component: grid_cards = CSS-grid feature cards,
        two_column = flex row, content = sidebar layout, timeline = horizontal
        stepper, title_cover = hero section, conclusion = CTA block
      - params.columns = grid column count; params.density = spacing scale
        (compact/normal/airy)
      - recipe = component class (.card / .kpi / .quote); box(recipe="card") is
        <div class="card">
      - frame/rail/corner_mark = page decoration (border frame, side rail, corner mark)
      - image fit_mode="contain"/"cover" = CSS object-fit
      - The difference: HTML says *how* (CSS rules); here you declare *what*
        (semantic intent) and the solver computes coordinates. Never hand-write
        regions/coordinates yourself — escape hatches exist for the human's
        approval, not for you.

      ## Workflow
      1. Questionnaire — 8 items; ask each missing item once via multi-select,
         never guess: topic / audience (executives, customers, colleagues,
         teachers, public) / occasion (report, proposal, training, launch,
         defense) / page count (default 8) / style (6 presets) / colors (relay
         preset names or user hex verbatim — never invent) / images (path list,
         in order) / density
      2. Generate the deck JSON — declarations only (archetype + params + recipe
         + frame; elements carry id/type/text). Keep text short: titles ≤15
         chars, boxes ≤30, bullets ≤4 per page and ≤25 chars each.
      3. Write the deck to D:\ppt\_deck_auto.json; read D:\ppt\_palette_auto.json
         and merge into overrides (conversation hex wins).
      4. Build via the slideReflex remote (frames stream to the panel; the panel
         auto-opens on the right).
      5. Diagnostics loop — fix only severity=error (overflow/overlap/
         region_out_of_page...); change declarations, never coordinates; max 3
         rounds. Harmony violations (color_ratio/focal_point/hue_harmony) are
         warnings — fix them by changing style/recipe/layout intent.
      6. Feedback protocol — read D:\ppt\_feedback_auto.json requests
         {color | question | area}: color is auto-applied by the panel; you
         handle question/area. Read D:\ppt\_selection_auto.json to resolve
         "this/that". Fuzzy words: 挤/crowded → lower density or remove
         elements; 空/empty → raise density or add; 乱/messy → change archetype;
         丑/ugly → change style/recipe; 看不清 → contrast. Offer 2-3 concrete
         options, never guess; if the user cannot decide, produce two variants.
      7. Escape hatches — only when declarations cannot express the need; say so
         explicitly: L1 hand-write regions / blank archetype; L2 element params
         pw/ph/align_h/margin/role; L3 take over with python (python-pptx /
         officecli). Never force a declaration that does not fit.

      ## Hard rules
      - Valid JSON only (double quotes, no comments, no trailing commas).
      - Never call raw-color params (fill_color etc.) — the engine rejects them
        with raw_color_forbidden; use recipe/style tokens instead.
      - The panel preview is live and the human watching it is the ceiling —
        honor their visual judgment and feedback.
    complete: true
    includeRuntimeContext: false

# The PTY registry is an agent-owned service, so it lives in an entry-local
# realm. The backend still consumes the host sandbox policy and subprocess
# implementation, while the tool registers into this agent's scoped catalog.
- id: persistent-shell
  name: cordis:group
  group: true
  isolate:
    terminals: true
  config:
    - id: pty
      name: '@deepseek-ai/dsh-terminal'

    - id: terminal-bash
      name: '@deepseek-ai/dsh-terminal-bash'
      config:
        timeoutMs: 300000

    - id: persistent-bash
      name: '@deepseek-ai/dsh-tool-bash-persistent'
      config:
        timeoutMs: 300000
        description: |-
          Run commands in a bash shell
          * When invoking this tool, the contents of the "command" parameter does NOT need to be XML-escaped.
          * You don't have access to the internet via this tool.
          * You do have access to a mirror of common linux and python packages via apt and pip.
          * State is persistent across command calls and discussions with the user.
          * To inspect a particular line range of a file, e.g. lines 10-25, try 'sed -n 10,25p /path/to/the/file'.
          * Please avoid commands that may produce a very large amount of output.
          * Please run long lived commands in the background, e.g. 'sleep 10 &' or start a server in the background.

# The bare local filesystem shadows the host's sandboxed provider only for this
# preset. The editor shares that realm and requires absolute paths.
- id: filesystem
  name: cordis:group
  group: true
  isolate:
    fs: true
  config:
    - id: fs-local
      name: '@deepseek-ai/dsh-fs-local'
      config:
        cwd: !!js process.env.DSH_CWD ?? process.cwd()

    - id: str-replace-editor
      name: '@deepseek-ai/dsh-tool-str-replace-editor'
      config:
        maxOutputChars: 16000

# dsh-slide-reflex publishes the `slideReflex` Typert remote service, so the
# skill rule requires it behind an entry-local isolate realm (a loose service
# publisher is rejected at mount). RISK: the Typert gateway that bridges the
# client/API RPC is a host-plane, cross-session consumer — if it cannot resolve
# the isolated service, the client preview will fail. Validate with
# standingKeyFor('ppt-maker') and a real session; if the bridge breaks, keep
# this row in the host composition and scope the panel via the client Gate only.
- id: slide-reflex
  name: cordis:group
  group: true
  isolate:
    slideReflex: true
  config:
    - id: dsh-slide-reflex
      name: dsh-slide-reflex
